name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,web]"

      - name: Run tests
        run: python -m pytest -vv

      - name: Run Ruff lint
        run: python -m ruff check .

      - name: Check Ruff formatting
        run: python -m ruff format --check .

      - name: Check installed dependencies
        run: python -m pip check

      - name: Smoke test CLI entry points
        run: |
          python -m reconcile --help
          reconcile --help

      - name: Smoke test sample reconciliation
        run: |
          reconcile \
            --purchase-orders examples/sample_data/purchase_orders.csv \
            --receipts examples/sample_data/goods_receipts.csv \
            --invoices examples/sample_data/invoices.csv \
            --format json \
            --output "${RUNNER_TEMP}/sample-report.json"

      - name: Build source and wheel distributions
        run: python -m build

      - name: Smoke test built wheel
        if: matrix.python-version == '3.12'
        run: |
          python -m venv "${RUNNER_TEMP}/wheel-venv"
          "${RUNNER_TEMP}/wheel-venv/bin/python" -m pip install --no-deps dist/*.whl
          "${RUNNER_TEMP}/wheel-venv/bin/python" -c "import reconcile"
          "${RUNNER_TEMP}/wheel-venv/bin/reconcile" --help
          "${RUNNER_TEMP}/wheel-venv/bin/reconcile" \
            --purchase-orders examples/sample_data/purchase_orders.csv \
            --receipts examples/sample_data/goods_receipts.csv \
            --invoices examples/sample_data/invoices.csv \
            --format json \
            --output "${RUNNER_TEMP}/wheel-sample-report.json"

  database:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install database and test dependencies
        run: python -m pip install -e ".[dev,db]"
      - name: Verify clean migrations, data integrity, and tenant isolation
        run: python -m pytest tests/database -vv

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      E2E_PYTHON_EXECUTABLE: python
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8010
      NEXT_PUBLIC_RECONCILIATION_TIMEOUT_MS: 120000

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install API dependencies
        working-directory: ${{ github.workspace }}
        run: python -m pip install -e ".[web]"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend tests
        run: npm test -- --run

      - name: Build frontend
        run: npm run build

      - name: Run browser E2E and accessibility tests
        run: npm run test:e2e
