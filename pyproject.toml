[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-purchase-order-reconciliation"
version = "0.1.0"
description = "Deterministic invoice matching, receipt coverage, and purchase-order fulfillment analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ayoub Boudani" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.scripts]
reconcile = "reconcile.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "httpx2>=2.12,<3",
  "pytest>=7.4,<10",
  "ruff>=0.6,<1",
]
web = [
  "fastapi>=0.141,<1",
  "python-multipart>=0.0.32,<1",
  "uvicorn>=0.52,<1",
]
db = [
  "SQLAlchemy>=2.0.46,<2.1",
  "alembic>=1.18,<2",
  "psycopg[binary]>=3.3,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = ["database: requires an explicitly configured disposable PostgreSQL database"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
